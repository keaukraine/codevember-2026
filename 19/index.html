          float life = fract(aPhase + uTime * aSpeed);
          float fall = life * 7.5;
          vec3 p = uOrigin;
          float spread = 0.5 + life * 3.0;
          p.x += aSideX * spread + sin(uTime * 1.4 + aPhase * 21.0) * 0.35 * life + life * life * 0.7;
          p.z += aSideZ * spread + cos(uTime * 1.1 + aPhase * 17.0) * 0.3 * life;
          p.y -= fall;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = aSize * (0.6 + life * 0.5) * uPixelRatio * (55.0 / max(1.0, -mv.z));
          vAlpha = smoothstep(0.0, 0.06, life) * (1.0 - smoothstep(0.68, 1.0, life)) * 0.22;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        varying float vAlpha;
        void main() {
          vec2 d = gl_PointCoord - 0.5;
          float a = smoothstep(0.5, 0.0, length(d));
          gl_FragColor = vec4(uColor, a * vAlpha);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending,
    });
    sandfall = new THREE.Points(geo, mat);
    sandfall.frustumCulled = false;
    scene.add(sandfall);
  }

  function updateSandfall(t) {
    if (!sandfall) return;
    sandfallUniforms.uTime.value = t;
    sandfallUniforms.uPixelRatio.value = Math.min(window.devicePixelRatio || 1, QUALITY.maxPixelRatio);
    if (heroGroup) {
      heroGroup.updateWorldMatrix(true, false);
      _v1.set(2.05, 8.15, 0.95).applyMatrix4(heroGroup.matrixWorld);
      sandfallUniforms.uOrigin.value.copy(_v1);
    }
  }

  /* ================================================================== */
  /*  vegetation                                                        */
  /* ================================================================== */

  const detailGroup = new THREE.Group();
  scene.add(detailGroup);

  const windTimeUniform = { value: 0 };
  const windStrengthUniform = { value: params.wind };

  function windify(material, bend, cacheKey) {
    material.onBeforeCompile = (shader) => {
      shader.uniforms.uWindTime = windTimeUniform;
      shader.uniforms.uWindStrength = windStrengthUniform;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', `#include <common>
          uniform float uWindTime;
          uniform float uWindStrength;`)
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          #ifdef USE_INSTANCING
            vec2 iwp = instanceMatrix[3].xz;
            float ph = iwp.x * 0.42 + iwp.y * 0.31;
            float sway = (sin(uWindTime * 1.7 + ph) * 0.6 + sin(uWindTime * 2.9 + ph * 1.7) * 0.3) * uWindStrength;
            float bendAmt = smoothstep(0.0, 0.9, position.y);
            transformed.x += sway * ${bend.toFixed(3)} * bendAmt;
            transformed.z += sway * ${(bend * 0.7).toFixed(3)} * bendAmt;
          #endif`);
      material.customProgramCacheKey = () => cacheKey;
    };
    return material;
  }

  function makeGrassTuftGeometry(seed) {
    const rng = makeRng(seed);
    const parts = [];
    for (let b = 0; b < 7; b++) {
      const bh = 0.55 + rng() * 0.5;
      const geo = new THREE.PlaneGeometry(0.035, bh, 1, 4).toNonIndexed();
      geo.translate(0, bh * 0.5, 0);
      const p = geo.attributes.position;
      const hMax = bh;
      const lean = 0.12 + rng() * 0.18;
      const dir = rng() * Math.PI * 2;
      for (let i = 0; i < p.count; i++) {
        const y = p.getY(i) + 0.0;
        const k = clamp01(y / hMax);
        p.setX(i, p.getX(i) * (1 - k * 0.9) + Math.cos(dir) * lean * k * k);
        p.setZ(i, Math.sin(dir) * lean * k * k);
      }
      geo.translate((rng() - 0.5) * 0.25, 0, (rng() - 0.5) * 0.25);
      geo.rotateY(rng() * Math.PI);
      const cols = [];
      const base = new THREE.Color(0x8f7b4b).lerp(new THREE.Color(0xc4a86a), rng());
      for (let i = 0; i < p.count; i++) {
        const k = 0.8 + rng() * 0.35;
        cols.push(base.r * k, base.g * k, base.b * k);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      parts.push(geo);
    }
    for (let s = 0; s < 3; s++) {
      const stemH = 0.65 + rng() * 0.35;
      const stem = new THREE.CylinderGeometry(0.005, 0.009, stemH, 3, 1, true).toNonIndexed();
      stem.translate(0, stemH / 2, 0);
      const lean = 0.1 + rng() * 0.12;
      const dir = rng() * Math.PI * 2;
      stem.rotateX(Math.cos(dir) * lean);
      stem.rotateZ(Math.sin(dir) * lean);
      stem.translate((rng() - 0.5) * 0.25, 0, (rng() - 0.5) * 0.25);
      const colsS = [];
      const sc = new THREE.Color(0xb59a66);
      for (let i = 0; i < stem.attributes.position.count; i++) {
        colsS.push(sc.r, sc.g, sc.b);
      }
      stem.setAttribute('color', new THREE.Float32BufferAttribute(colsS, 3));
      parts.push(stem);
      const seed = new THREE.ConeGeometry(0.025, 0.09, 4, 1, true).toNonIndexed();
      seed.translate(0, stemH + 0.03, 0);
      const colsSeed = [];
      const sc2 = new THREE.Color(0xcbb17a);
      for (let i = 0; i < seed.attributes.position.count; i++) {
        colsSeed.push(sc2.r, sc2.g, sc2.b);
      }
      seed.setAttribute('color', new THREE.Float32BufferAttribute(colsSeed, 3));
      parts.push(seed);
    }
    const merged = mergeGeometries(parts, false);
    for (const q of parts) q.dispose();
    return merged;
  }

  function makeShrubGeometry(seed) {
    const rng = makeRng(seed);
    const parts = [];
    const twigBase = new THREE.Color(0x6a5740);
    const leafBase = new THREE.Color(0x7c7a5a);

    // woody stems
    for (let i = 0; i < 9; i++) {
      const a = rng() * Math.PI * 2;
      const tilt = 0.2 + rng() * 0.5;
      const len = 0.18 + rng() * 0.2;
      const startX = (rng() - 0.5) * 0.1;
      const startZ = (rng() - 0.5) * 0.1;
      const endX = startX + Math.cos(a) * Math.sin(tilt) * len;
      const endZ = startZ + Math.sin(a) * Math.sin(tilt) * len;
      const endY = 0.05 + Math.cos(tilt) * len;
      const dir = new THREE.Vector3(endX - startX, endY - 0.03, endZ - startZ);
      const l = dir.length();
      const geo = new THREE.CylinderGeometry(0.006, 0.014, l, 3, 1, true).toNonIndexed();
      geo.translate(0, l / 2, 0);
      geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(UP, dir.clone().normalize()));
      geo.translate(startX, 0.02, startZ);
      const cols = [];
      const shade = 0.8 + rng() * 0.3;
      for (let k = 0; k < geo.attributes.position.count; k++) {
        cols.push(twigBase.r * shade, twigBase.g * shade, twigBase.b * shade);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      parts.push(geo);
    }

    // soft sage foliage clusters
    for (let i = 0; i < 46; i++) {
      const a = rng() * Math.PI * 2;
      const rr = Math.pow(rng(), 0.6) * 0.36;
      const x = Math.cos(a) * rr;
      const z = Math.sin(a) * rr;
      const y = 0.12 + rng() * 0.38 * (1.0 - rr * 1.2) + rr * 0.15;
      const leaf = new THREE.IcosahedronGeometry(0.055 + rng() * 0.045, 0);
      leaf.scale(1.15 + rng() * 0.4, 0.6 + rng() * 0.4, 1.0 + rng() * 0.35);
      leaf.rotateY(rng() * Math.PI * 2);
      leaf.rotateX((rng() - 0.5) * 0.4);
      leaf.translate(x, y, z);
      const lc = leafBase.clone().lerp(new THREE.Color(0xa09570), rng());
      lc.offsetHSL((rng() - 0.5) * 0.02, 0, (rng() - 0.5) * 0.08);
      const colsL = [];
      const shadeL = 0.8 + rng() * 0.35;
      for (let n = 0; n < leaf.attributes.position.count; n++) {
        colsL.push(lc.r * shadeL, lc.g * shadeL, lc.b * shadeL);
      }
      leaf.setAttribute('color', new THREE.Float32BufferAttribute(colsL, 3));
      parts.push(leaf);
    }

    const merged = mergeGeometries(parts, false);
    for (const q of parts) q.dispose();
    return merged;
  }

  let shrubMeshes = [];
  let grassMeshes = [];

  function buildVegetation() {
    for (const m of shrubMeshes) {
      detailGroup.remove(m);
      m.geometry.dispose();
      m.material.dispose();
    }
    for (const m of grassMeshes) {
      detailGroup.remove(m);
      m.geometry.dispose();
      m.material.dispose();
    }
    shrubMeshes = [];
    grassMeshes = [];

    const rng = makeRng(params.seed * 3001 + 17);

    const shrubCount = Math.round(30 * params.shrubs);
    if (shrubCount > 0) {
      const shrubMat = windify(new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 1.0,
        metalness: 0,
        flatShading: true,
        side: THREE.DoubleSide,
      }), 0.05, 'shrub-wind');
      const variants = [makeShrubGeometry(901), makeShrubGeometry(902), makeShrubGeometry(903)];
      const groups = [[], [], []];
      const dummy = new THREE.Object3D();
      for (let i = 0; i < shrubCount; i++) {
        const v = Math.floor(rng() * 3);
        let x, z, tries = 0;
        do {
          const a = rng() * Math.PI * 2;
          const r = 4.5 + rng() * 34;
          x = Math.cos(a) * r;
          z = Math.sin(a) * r;
          tries++;
        } while (tries < 8 && (Math.hypot(x + 2.4, z + 1.2) < 4.2 || Math.hypot(x - ARCH_X, z - ARCH_Z) < 5.0));
        const scale = 0.6 + rng() * 0.75;
        const m = new THREE.Matrix4().compose(
          new THREE.Vector3(x, terrainHeight(x, z) - 0.05, z),
          new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rng() * Math.PI * 2, 0)),
          new THREE.Vector3(scale, scale * (0.8 + rng() * 0.4), scale)
        );
        groups[v].push(m);
      }
      for (let v = 0; v < 3; v++) {
        if (!groups[v].length) { variants[v].dispose(); continue; }
        const mesh = new THREE.InstancedMesh(variants[v], shrubMat, groups[v].length);
        groups[v].forEach((mat, i) => mesh.setMatrixAt(i, mat));
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = false;
        mesh.receiveShadow = true;
        mesh.frustumCulled = false;
        detailGroup.add(mesh);
        shrubMeshes.push(mesh);
      }
    }

    const grassCount = Math.round(150 * params.grass);
    if (grassCount > 0) {
      const grassMat = windify(new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.95,
        metalness: 0,
        side: THREE.DoubleSide,
      }), 0.11, 'grass-wind');
      const variants = [makeGrassTuftGeometry(411), makeGrassTuftGeometry(412)];
      const groups = [[], []];
      const dummy = new THREE.Object3D();
      for (let i = 0; i < grassCount; i++) {
        const v = Math.floor(rng() * 2);
        let x, z, tries = 0;
        do {
          const a = rng() * Math.PI * 2;
          const r = 3.5 + rng() * 30;
          x = Math.cos(a) * r;
          z = Math.sin(a) * r;
          tries++;
        } while (tries < 8 && (Math.hypot(x + 2.4, z + 1.2) < 3.6 || Math.hypot(x - ARCH_X, z - ARCH_Z) < 4.6));
        const scale = 0.6 + rng() * 0.9;
        const m = new THREE.Matrix4().compose(
          new THREE.Vector3(x, terrainHeight(x, z) - 0.03, z),
          new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rng() * Math.PI * 2, 0)),
          new THREE.Vector3(scale, scale, scale)
        );
        groups[v].push(m);
      }
      for (let v = 0; v < 2; v++) {
        if (!groups[v].length) { variants[v].dispose(); continue; }
        const mesh = new THREE.InstancedMesh(variants[v], grassMat, groups[v].length);
        groups[v].forEach((mat, i) => mesh.setMatrixAt(i, mat));
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = false;
        mesh.receiveShadow = false;
        mesh.frustumCulled = false;
        detailGroup.add(mesh);
        grassMeshes.push(mesh);
      }
    }
  }

  /* ================================================================== */
  /*  tumbleweeds                                                       */
  /* ================================================================== */

  function makeTumbleweedGeometry(seed) {
    const rng = makeRng(seed);
    const parts = [];
    const base = new THREE.Color(0xd4b37e);
    for (let i = 0; i < 130; i++) {
      const a1 = new THREE.Vector3(rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1).normalize();
      const a2 = new THREE.Vector3(rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1).normalize();
      const p1 = a1.multiplyScalar(0.15 + rng() * 0.55);
      const p2 = a2.multiplyScalar(0.35 + rng() * 0.5);
      const axis = p2.clone().sub(p1);
      const l = axis.length();
      if (l < 0.05) { i--; continue; }
      const geo = new THREE.CylinderGeometry(0.004 + rng() * 0.006, 0.008 + rng() * 0.009, l, 3, 1, true);
      geo.translate(0, l / 2, 0);
      geo.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(UP, axis.normalize()));
      geo.translate(p1.x, p1.y, p1.z);
      const cols = [];
      const shade = 0.6 + rng() * 0.55;
      for (let k = 0; k < geo.attributes.position.count; k++) {
        cols.push(base.r * shade, base.g * shade, base.b * shade * 0.9);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      parts.push(geo);
    }
    const merged = mergeGeometries(parts, false);
    for (const p of parts) p.dispose();
    return merged;
  }

  let tumbleweedMesh = null;
  let tumbleweeds = [];

  function buildTumbleweeds() {
    if (tumbleweedMesh) {
      scene.remove(tumbleweedMesh);
      tumbleweedMesh.geometry.dispose();
      tumbleweedMesh.material.dispose();
      tumbleweedMesh = null;
    }
    tumbleweeds = [];
    const count = Math.max(0, Math.round(params.tumbleweeds));
    if (!count) return;

    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, side: THREE.DoubleSide });
    const geo = makeTumbleweedGeometry(77);
    tumbleweedMesh = new THREE.InstancedMesh(geo, mat, count);
    tumbleweedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    tumbleweedMesh.castShadow = true;
    tumbleweedMesh.frustumCulled = false;
    scene.add(tumbleweedMesh);

    const rng = makeRng(919);
    for (let i = 0; i < count; i++) {
      const size = 0.48 + rng() * 0.38;
      tumbleweeds.push({
        size,
        angle: rng() * Math.PI * 2,
        radiusX: 10.5 + rng() * 4.5,
        radiusZ: 8.5 + rng() * 4.0,
        speed: 0.1 + rng() * 0.08,
        cx: 1.5 + (rng() - 0.5) * 2,
        cz: 2.0 + (rng() - 0.5) * 2,
        y: 0,
        vy: 0,
        roll: new THREE.Quaternion(),
        hopTimer: 1.5 + rng() * 4,
        squash: 0,
        squashVel: 0,
        phase: rng() * Math.PI * 2,
        prevX: 0,
        prevZ: 0,
        grounded: true,
        stretch: 0,
      });
      const tw = tumbleweeds[i];
      if (i === 0) {
        tw.size = 0.8;
        tw.cx = 3.8; tw.cz = 5.0;
        tw.radiusX = 4.2; tw.radiusZ = 3.0;
        tw.speed = 0.17;
        tw.angle = 0.9;
      } else if (i === 1) {
        tw.size = 0.5;
        tw.cx = 0.0; tw.cz = 4.5;
        tw.radiusX = 8.5; tw.radiusZ = 7.0;
        tw.speed = 0.1;
      }
      tw.y = terrainHeight(tw.cx + Math.cos(tw.angle) * tw.radiusX, tw.cz + Math.sin(tw.angle) * tw.radiusZ) + tw.size * 0.95;
      tw.prevX = tw.cx + Math.cos(tw.angle) * tw.radiusX;
      tw.prevZ = tw.cz + Math.sin(tw.angle) * tw.radiusZ;
      const dummy = new THREE.Object3D();
      dummy.position.set(tw.prevX, tw.y, tw.prevZ);
      dummy.scale.setScalar(tw.size);
      dummy.updateMatrix();
      tumbleweedMesh.setMatrixAt(i, dummy.matrix);
    }
    tumbleweedMesh.instanceMatrix.needsUpdate = true;
  }

  function updateTumbleweeds(dt, t) {
    if (!tumbleweedMesh) return;
    const dummy = new THREE.Object3D();
    const axis = new THREE.Vector3();
    const q = new THREE.Quaternion();
    for (let i = 0; i < tumbleweeds.length; i++) {
      const tw = tumbleweeds[i];
      const gust = 0.72 + 0.28 * Math.sin(t * 0.42 + tw.phase) + 0.14 * Math.sin(t * 1.13 + tw.phase * 2.0);
      const speed = tw.speed * Math.max(0.25, gust) * params.wind;
      tw.angle += dt * speed * (0.85 + 0.15 * Math.sin(t * 0.3 + tw.phase));
      const x = tw.cx + Math.cos(tw.angle * 1.0) * tw.radiusX;
      const z = tw.cz + Math.sin(tw.angle * 0.92 + tw.phase * 0.3) * tw.radiusZ;
      const ground = terrainHeight(x, z) + tw.size * 0.92;

      // anticipation: a slight crouch as the gust approaches, then a hop
      tw.hopTimer -= dt;
      if (tw.grounded) {
        const anticipation = smoothstep(tw.hopTimer, 0.0, 0.55);
        tw.squash = Math.max(tw.squash, anticipation * 0.12);
        if (tw.hopTimer <= 0) {
          tw.vy = 2.9 + Math.random() * 0.8;
          tw.grounded = false;
          tw.hopTimer = 2.4 + Math.random() * 3.2;
          tw.stretch = 1;
        }
      }

      tw.vy -= 9.8 * dt;
      tw.y += tw.vy * dt;
      if (tw.y <= ground) {
        if (tw.vy < -0.6) {
          tw.squashVel += Math.min(2.2, -tw.vy * 0.32);
          tw.vy = -tw.vy * 0.32;
          tw.y = ground;
        } else {
          tw.y = ground;
          tw.vy = 0;
          tw.grounded = true;
        }
      } else {
        tw.grounded = false;
      }

      // squash & stretch spring
      tw.squashVel += (-tw.squash * 65 - tw.squashVel * 9) * dt;
      tw.squash = clamp(tw.squash + tw.squashVel * dt, -0.32, 0.38);
      tw.stretch = Math.max(0, tw.stretch - dt * 2.6);

      const vx = x - tw.prevX;
      const vz = z - tw.prevZ;
      const dist = Math.hypot(vx, vz);
      if (dist > 1e-5) {
        axis.set(-vz, 0, vx).normalize();
        q.setFromAxisAngle(axis, dist / tw.size * 0.9);
        tw.roll.premultiply(q);
      }
      tw.prevX = x;
      tw.prevZ = z;

      const stretch = tw.stretch * 0.12 + Math.min(0.22, Math.abs(tw.vy) * 0.035);
      dummy.position.set(x, tw.y, z);
      dummy.quaternion.copy(tw.roll);
      const sy = 1 - tw.squash * 0.85 + stretch;
      const sxz = 1 + tw.squash * 0.35 - stretch * 0.3;
      dummy.scale.set(tw.size * sxz, tw.size * sy, tw.size * sxz);
      dummy.updateMatrix();
      tumbleweedMesh.setMatrixAt(i, dummy.matrix);
    }
    tumbleweedMesh.instanceMatrix.needsUpdate = true;
  }

  /* ================================================================== */
  /*  birds                                                             */
  /* ================================================================== */

  const birdGroup = new THREE.Group();
  scene.add(birdGroup);
  let birds = [];

  function birdMaterial() {
    return new THREE.MeshStandardMaterial({ color: 0x261d18, roughness: 0.95, metalness: 0, side: THREE.DoubleSide });
  }

  function makeBirdGeometry(group, scale, mat, perched = false) {
    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), mat);
    body.scale.set(0.15, 0.12, 0.42);
    body.position.set(0, 0, 0);
    group.add(body);

    const head = new THREE.Group();
    head.position.set(0, 0.06, 0.42);
    const skull = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), mat);
    skull.scale.set(0.095, 0.09, 0.12);
    head.add(skull);
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.16, 6), mat);
    beak.rotation.x = Math.PI / 2;
    beak.position.set(0, -0.015, 0.13);
    head.add(beak);
    group.add(head);

    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.42, 4), mat);
    tail.rotation.x = -Math.PI / 2;
    tail.scale.set(1, 1, 0.28);
    tail.position.set(0, -0.01, -0.48);
    group.add(tail);

    const wings = [];
    for (const side of [-1, 1]) {
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 0.1, 0.05, 0.06);
      shoulder.rotation.x = 0.16;
      const innerShape = new THREE.Shape();
      innerShape.moveTo(0, 0);
      innerShape.lineTo(0.7, 0.13);
      innerShape.lineTo(0.76, -0.19);
      innerShape.lineTo(0.16, -0.22);
      innerShape.lineTo(0, -0.1);
      const inner = new THREE.Mesh(new THREE.ShapeGeometry(innerShape, 2), mat);
      inner.rotation.x = -Math.PI / 2;
      inner.position.x = side * 0.02;
      inner.scale.x = side;
      shoulder.add(inner);
      const elbow = new THREE.Group();
      elbow.position.x = side * 0.74;
      const outerShape = new THREE.Shape();
      outerShape.moveTo(0, 0);
      outerShape.lineTo(0.62, 0.02);
      outerShape.lineTo(0.72, -0.09);
      outerShape.lineTo(0.1, -0.17);
      outerShape.lineTo(0, -0.06);
      const outer = new THREE.Mesh(new THREE.ShapeGeometry(outerShape, 2), mat);
      outer.rotation.x = -Math.PI / 2;
      outer.position.x = side * 0.02;
      outer.scale.x = side;
      elbow.add(outer);
      shoulder.add(elbow);
      group.add(shoulder);
      wings.push({ shoulder, elbow, side });
    }
    group.scale.setScalar(scale);
    return { head, tail, wings, body };
  }

  function buildBirds() {
    for (const b of birds) {
      birdGroup.remove(b.group);
      b.group.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose();
      });
    }
    birds = [];
    const mat = birdMaterial();
    const count = Math.max(0, Math.round(params.birds));
    const rng = makeRng(621);
    for (let i = 0; i < count; i++) {
      const group = new THREE.Group();
      const parts = makeBirdGeometry(group, 1.35 + rng() * 0.45, mat);
      const bird = {
        group,
        parts,
        radius: 19 + rng() * 14,
        height: 17 + rng() * 9,
        angle: rng() * Math.PI * 2,
        speed: 0.045 + rng() * 0.035,
        cx: (rng() - 0.5) * 10,
        cz: -6 + (rng() - 0.5) * 10,
        phase: rng() * Math.PI * 2,
        flap: rng() * 10,
      };
      group.position.set(bird.cx + Math.cos(bird.angle) * bird.radius, bird.height, bird.cz + Math.sin(bird.angle) * bird.radius);
      birdGroup.add(group);
      birds.push(bird);
    }
  }

  function updateBirds(dt, t) {
    for (const b of birds) {
      b.angle += dt * b.speed;
      const x = b.cx + Math.cos(b.angle) * b.radius;
      const z = b.cz + Math.sin(b.angle) * b.radius;
      const y = b.height + Math.sin(t * 0.5 + b.phase) * 0.8;
      b.group.position.set(x, y, z);
      const heading = -b.angle;
      b.group.rotation.set(0, heading, 0);
      b.group.rotation.z = 0.22 + Math.sin(t * 0.4 + b.phase) * 0.04;

      const flapPhase = Math.sin(t * 0.22 + b.phase);
      const burst = smoothstep(flapPhase, 0.62, 0.98);
      const glide = 0.16 + Math.sin(t * 0.6 + b.phase) * 0.03;
      const flap = Math.sin(t * 6.0 + b.phase * 3.0) * 0.55 * burst;
      const newFlap = lerp(glide, glide + flap, burst);
      for (const w of b.parts.wings) {
        w.shoulder.rotation.z = w.side * newFlap;
        w.elbow.rotation.z = w.side * (newFlap * 0.5 + Math.sin(t * 6.0 - 0.5 + b.phase * 3.0) * 0.22 * burst);
        w.elbow.rotation.x = Math.sin(t * 1.4 + b.phase) * 0.05;
      }
      b.parts.head.rotation.y = Math.sin(t * 0.7 + b.phase) * 0.14;
      b.parts.tail.rotation.x = -Math.PI / 2 + Math.sin(t * 1.2 + b.phase) * 0.08;
      b.parts.body.rotation.z = Math.sin(t * 0.8 + b.phase) * 0.04;
    }
  }

  function buildPerchedBird(group) {
    const mat = birdMaterial();
    const parts = makeBirdGeometry(group, 0.5, mat, true);
    // fold the wings against the body
    for (const w of parts.wings) {
      w.shoulder.rotation.z = w.side * 1.35;
      w.shoulder.rotation.y = w.side * 0.25;
      w.elbow.rotation.z = w.side * -0.4;
    }
    parts.tail.rotation.x = -Math.PI / 2 - 0.4;
    group.userData.parts = parts;
  }

  function updatePerchedBird(t) {
    if (!perchedBird || !perchedBird.visible) return;
    const parts = perchedBird.userData.parts;
    if (!parts) return;
    const look = Math.sin(t * 0.33 + 1.7);
    const turn = smoothstep(look, 0.35, 0.95) - smoothstep(look, -0.35, -0.95);
    parts.head.rotation.y = turn * 0.9;
    parts.head.rotation.x = Math.sin(t * 0.7) * 0.03;
    parts.tail.rotation.z = Math.sin(t * 0.8 + 2.0) * 0.06;
    if (Math.sin(t * 0.19) > 0.94) {
      parts.wings[0].elbow.rotation.z = -0.4 + Math.sin(t * 18) * 0.12;
    }
  }

  /* ================================================================== */
  /*  dust devils / wisps / motes / sandfall                            */
  /* ================================================================== */

  const devilGroup = new THREE.Group();
  scene.add(devilGroup);
  let dustDevils = [];

  function buildDustDevils() {
    for (const d of dustDevils) {
      devilGroup.remove(d.points);
      d.points.geometry.dispose();
      d.points.material.dispose();
    }
    dustDevils = [];
    const count = Math.max(0, Math.round(params.dustDevils));
    if (!count) return;
    const rng = makeRng(4001);
    for (let k = 0; k < count; k++) {
      const n = 240;
      const pos = new Float32Array(n * 3);
      const angle = new Float32Array(n);
      const radius = new Float32Array(n);
      const phase = new Float32Array(n);
      const speed = new Float32Array(n);
      const size = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        angle[i] = rng() * Math.PI * 2;
        radius[i] = 0.25 + rng() * 1.6;
        phase[i] = rng();
        speed[i] = 0.35 + rng() * 0.5;
        size[i] = 0.8 + rng() * 1.5;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aAngle', new THREE.BufferAttribute(angle, 1));
      geo.setAttribute('aRadius', new THREE.BufferAttribute(radius, 1));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
      geo.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
      geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
      const devilPositions = [[-7, -18], [19, -26], [-21, 3], [7, -34]];
      const dp = devilPositions[k % devilPositions.length];
      const x = dp[0] + (rng() - 0.5) * 2;
      const z = dp[1] + (rng() - 0.5) * 2;
      const y = terrainHeight(x, z);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uCenter: { value: new THREE.Vector3(x, y, z) },
          uHeight: { value: 4.5 + rng() * 3.5 },
          uColor: { value: new THREE.Color(0xd8b088) },
          uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, QUALITY.maxPixelRatio) },
          uOpacity: { value: 0.22 },
        },
        vertexShader: `
          uniform float uTime;
          uniform vec3 uCenter;
          uniform float uHeight;
          uniform float uPixelRatio;
          attribute float aAngle;
          attribute float aRadius;
          attribute float aPhase;
          attribute float aSpeed;
          attribute float aSize;
          varying float vAlpha;
          void main() {
            float life = fract(aPhase + uTime * aSpeed * 0.055);
            float ang = aAngle + life * 7.0 + uTime * 0.35;
            float y = life * uHeight;
            float rad = aRadius * (0.35 + 0.75 * life) * (1.0 + 0.12 * sin(uTime * 0.9 + aPhase * 7.0));
            vec3 p = uCenter + vec3(cos(ang) * rad, y, sin(ang) * rad);
            p.x += sin(uTime * 0.55 + aPhase * 12.0) * 0.25 * life;
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = aSize * (0.65 + 0.8 * life) * uPixelRatio * (85.0 / max(1.0, -mv.z));
            vAlpha = smoothstep(0.0, 0.12, life) * (1.0 - smoothstep(0.55, 1.0, life)) * 0.7;
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uOpacity;
          varying float vAlpha;
          void main() {
            vec2 d = gl_PointCoord - 0.5;
            float a = smoothstep(0.5, 0.02, length(d));
            a = a * a;
            gl_FragColor = vec4(uColor, a * vAlpha * uOpacity);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.NormalBlending,
      });
      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;
      devilGroup.add(points);
      dustDevils.push({ points, material: mat });
    }
  }

  function updateDustDevils(t) {
    for (const d of dustDevils) {
      d.material.uniforms.uTime.value = t;
      d.material.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio || 1, QUALITY.maxPixelRatio);
    }
  }

  let wispsMesh = null;
  let wispsMat = null;
  let wispState = [];
  const windDir2 = new THREE.Vector2(0.82, 0.57).normalize();

  function buildWisps() {
    if (wispsMesh) {
      scene.remove(wispsMesh);
      wispsMesh.geometry.dispose();
      wispsMat.dispose();
      wispsMesh = null;
      wispsMat = null;
    }
    wispsMat = new THREE.MeshBasicMaterial({
      map: streakTex,
      transparent: true,
      opacity: 0.12,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.NormalBlending,
      color: 0xffe0b8,
    });
    const geo = new THREE.PlaneGeometry(1, 1);
    const n = 28;
    wispsMesh = new THREE.InstancedMesh(geo, wispsMat, n);
    wispsMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    wispsMesh.frustumCulled = false;
    wispsMesh.renderOrder = 5;
    scene.add(wispsMesh);
    const rng = makeRng(515);
    wispState = [];
    for (let i = 0; i < n; i++) {
      wispState.push({
        x: (rng() - 0.5) * 58,
        z: (rng() - 0.5) * 58,
        y: 0.4 + rng() * 2.0,
        speed: 2.5 + rng() * 4.0,
        sx: 2.0 + rng() * 3.0,
        sy: 0.22 + rng() * 0.35,
        phase: rng() * 10,
        roll: (rng() - 0.5) * 0.3,
      });
    }
    wispsMesh.visible = params.sandWisps;
  }

  function updateWisps(dt, t) {
    if (!wispsMesh) return;
    wispsMesh.visible = params.sandWisps && params.wind > 0.02 && wispsMat.opacity > 0.005;
    if (!wispsMesh.visible) return;
    const dummy = new THREE.Object3D();
    for (let i = 0; i < wispState.length; i++) {
      const w = wispState[i];
      const gust = 0.6 + 0.4 * Math.sin(t * 0.5 + w.phase);
      w.x += windDir2.x * w.speed * gust * dt * params.wind;
      w.z += windDir2.y * w.speed * gust * dt * params.wind;
      if (w.x > 34) w.x -= 68;
      if (w.z > 34) w.z -= 68;
      if (w.x < -34) w.x += 68;
      if (w.z < -34) w.z += 68;
      const y = terrainHeight(w.x, w.z) + w.y + Math.sin(t * 0.7 + w.phase) * 0.18;
      dummy.position.set(w.x, y, w.z);
      dummy.quaternion.copy(camera.quaternion);
      dummy.quaternion.multiply(_q2.setFromAxisAngle(_v1.set(0, 0, 1), w.roll + Math.sin(t * 0.5 + w.phase) * 0.06));
      dummy.scale.set(w.sx * gust, w.sy, 1);
      dummy.updateMatrix();
      wispsMesh.setMatrixAt(i, dummy.matrix);
    }
    wispsMesh.instanceMatrix.needsUpdate = true;
  }

  let motes = null;
  let motesMat = null;
  let moteState = [];

  function buildMotes() {
    if (motes) {
      scene.remove(motes);
      motes.geometry.dispose();
      motesMat.dispose();
    }
    const n = QUALITY.motes;
    const pos = new Float32Array(n * 3);
    const rng = makeRng(818);
    moteState = [];
    for (let i = 0; i < n; i++) {
      const x = (rng() - 0.5) * 60;
      const z = (rng() - 0.5) * 60;
      const y = terrainHeight(x, z) + 0.3 + rng() * 9;
      pos[i * 3] = x;
      pos[i * 3 + 1] = y;
      pos[i * 3 + 2] = z;
      moteState.push({ x, y, z, phase: rng() * 6.28, speed: 0.5 + rng() * 1.5 });
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    motesMat = new THREE.PointsMaterial({
      size: 0.065,
      map: softTex,
      transparent: true,
      opacity: 0.5,
      depthWrite: false,
      color: 0xffe8c8,
      sizeAttenuation: true,
      blending: THREE.NormalBlending,
    });
    motes = new THREE.Points(geo, motesMat);
    motes.frustumCulled = false;
    scene.add(motes);
  }

  function updateMotes(dt, t) {
    if (!motes) return;
    const attr = motes.geometry.attributes.position;
    for (let i = 0; i < moteState.length; i++) {
      const m = moteState[i];
      const gust = 0.7 + 0.3 * Math.sin(t * 0.6 + m.phase);
      m.x += windDir2.x * m.speed * dt * gust * params.wind;
      m.z += windDir2.y * m.speed * dt * gust * params.wind;
      m.y += Math.sin(t * 0.9 + m.phase) * dt * 0.15;
      if (m.x > 32) m.x -= 64;
      if (m.z > 32) m.z -= 64;
      if (m.x < -32) m.x += 64;
      if (m.z < -32) m.z += 64;
      attr.setXYZ(i, m.x, m.y, m.z);
    }
    attr.needsUpdate = true;
  }

  /* ================================================================== */
  /*  world build                                                       */
  /* ================================================================== */

  function rebuildWorld(opts = {}) {
    const terrainDirty = opts.terrain !== false;
    if (terrainDirty) buildTerrain();
    buildBackground();
    buildFormations();
    buildVegetation();
    buildTumbleweeds();
    buildBirds();
    buildDustDevils();
    buildLizard();
    buildSandfall();
    if (!wispsMesh) buildWisps();
    if (!motes) buildMotes();
  }

  // static-ish details first
  buildTerrain();
  buildBackground();
  buildFormations();
  buildVegetation();
  buildTumbleweeds();
  buildBirds();
  buildDustDevils();
  buildLizard();
  buildSandfall();
  buildWisps();
  buildMotes();
  updateSky();

  /* ================================================================== */
  /*  GUI                                                               */
  /* ================================================================== */

  const gui = new GUI({ title: 'Erosion · settings', width: 284 });

  const fScene = gui.addFolder('Scene');
  const timeCtrl = fScene.add(params, 'timeOfDay', 0, 24, 0.01).name('Time of day').onChange(updateSky);
  const presetFolder = fScene.addFolder('Presets').close();
  const presets = { Dawn: 6.4, Morning: 9.0, Noon: 12.5, 'Golden hour': 16.15, Sunset: 18.3, Dusk: 19.3, Night: 22.6 };
  for (const [name, hour] of Object.entries(presets)) {
    presetFolder.add({
      go: () => {
        params.timeOfDay = hour;
        updateSky();
        timeCtrl.updateDisplay();
      },
    }, 'go').name(name);
  }
  fScene.add(params, 'clouds', 0, 1, 0.01).name('Clouds').onChange(updateSky);
  fScene.add(params, 'fog', 0, 2, 0.01).name('Haze').onChange(updateSky);
  fScene.add(params, 'exposure', 0.4, 2, 0.01).name('Exposure').onChange(updateSky);
  fScene.add(params, 'wind', 0, 2, 0.01).name('Wind').onChange((v) => { windStrengthUniform.value = v; sandUniforms.uWind.value = v; });

  const fRock = gui.addFolder('Rock');
  fRock.add(params, 'seed', 1, 999, 1).name('Shape seed').onFinishChange(() => rebuildWorld({ terrain: false }));
  fRock.add({
    newSeed: () => {
      params.seed = 1 + Math.floor(Math.random() * 999);
      params.heroSeed = 1 + Math.floor(Math.random() * 999);
      rebuildWorld({ terrain: false });
      gui.controllersRecursive().forEach((c) => c.updateDisplay());
    },
  }, 'newSeed').name('New formations');
  fRock.add(params, 'palette', Object.keys(PALETTES)).name('Palette').onChange(applyPalette);
  fRock.add(params, 'strata', 0.5, 2.6, 0.01).name('Layer density').onChange((v) => { rockUniforms.uStrata.value = v; });
  fRock.add(params, 'varnish', 0, 1, 0.01).name('Desert varnish').onChange((v) => { rockUniforms.uVarnish.value = v; });
  fRock.add(params, 'bump', 0, 1.4, 0.01).name('Rock grain').onChange((v) => { rockUniforms.uBump.value = v; });
  fRock.add(params, 'dust', 0, 1, 0.01).name('Dust film').onChange((v) => { rockUniforms.uDust.value = v; });

  const fForm = gui.addFolder('Formations');
  fForm.add(params, 'clusters', 4, 18, 1).name('Hoodoo clusters').onFinishChange(() => rebuildWorld({ terrain: false }));
  fForm.add(params, 'density', 0.4, 1.8, 0.01).name('Density').onFinishChange(() => rebuildWorld({ terrain: false }));
  fForm.add(params, 'heroSeed', 1, 999, 1).name('Hero rock seed').onFinishChange(() => rebuildWorld({ terrain: false }));
  fForm.add(params, 'heroScale', 0.7, 1.35, 0.01).name('Hero rock size').onChange((v) => {
    if (heroGroup) heroGroup.scale.setScalar(v);
  });
  fForm.add(params, 'arch', true).name('Stone arch').onChange((v) => {
    if (archGroup) archGroup.visible = v;
  });
  fForm.add({
    wind: () => {
      params.terrainSeed = 1 + Math.floor(Math.random() * 999);
      rebuildWorld({ terrain: true });
      gui.controllersRecursive().forEach((c) => c.updateDisplay());
    },
  }, 'wind').name('New terrain');

  const fTerrain = gui.addFolder('Terrain');
  fTerrain.add(params, 'dunes', 0, 2, 0.01).name('Dune height').onFinishChange(() => rebuildWorld({ terrain: true }));
  fTerrain.add(params, 'ridge', 0, 2, 0.01).name('Amphitheatre').onFinishChange(() => rebuildWorld({ terrain: true }));

  const fDetails = gui.addFolder('Details');
  fDetails.add(params, 'tumbleweeds', 0, 4, 1).name('Tumbleweeds').onChange(buildTumbleweeds);
  fDetails.add(params, 'birds', 0, 5, 1).name('Vultures').onChange(buildBirds);
  fDetails.add(params, 'perchedBird', true).name('Perched bird').onChange((v) => {
    if (perchedBird) perchedBird.visible = v;
  });
  fDetails.add(params, 'shrubs', 0, 2, 0.01).name('Shrubs').onFinishChange(buildVegetation);
  fDetails.add(params, 'grass', 0, 2, 0.01).name('Dry grass').onFinishChange(buildVegetation);
  fDetails.add(params, 'pebbles', 0, 2, 0.01).name('Rubble').onFinishChange(() => rebuildWorld({ terrain: false }));
  fDetails.add(params, 'dustDevils', 0, 4, 1).name('Dust devils').onChange(buildDustDevils);
  fDetails.add(params, 'sandWisps', true).name('Blowing sand').onChange((v) => { if (wispsMesh) wispsMesh.visible = v; });
  fDetails.add(params, 'lizard', true).name('Lizard').onChange(buildLizard);
  fDetails.add(params, 'sandfall', true).name('Falling sand').onChange(buildSandfall);

  const fFx = gui.addFolder('Post FX');
  fFx.add(params, 'bloom', 0, 2, 0.01).name('Bloom').onChange((v) => { bloomPass.strength = v; });
  fFx.add(params, 'grain', 0, 1, 0.01).name('Film grain').onChange((v) => { gradePass.uniforms.uGrain.value = v; });
  fFx.add(params, 'vignette', 0, 1, 0.01).name('Vignette').onChange((v) => { gradePass.uniforms.uVignette.value = v; });
  fFx.add(params, 'aberration', 0, 1, 0.01).name('Aberration').onChange((v) => { gradePass.uniforms.uAberration.value = v; });
  fFx.add(params, 'heat', 0, 1, 0.01).name('Heat shimmer').onChange((v) => { gradePass.uniforms.uHeat.value = v; });

  const fCam = gui.addFolder('Camera');
  fCam.add(params, 'autoOrbit').name('Auto orbit').onChange((v) => { controls.autoRotate = v; });
  fCam.add(params, 'autoOrbitSpeed', 0.05, 2, 0.01).name('Orbit speed').onChange((v) => { controls.autoRotateSpeed = v; });
  fCam.add(params, 'fov', 28, 70, 0.1).name('Field of view').onChange((v) => {
    camera.fov = v;
    camera.updateProjectionMatrix();
  });
  fCam.add({
    reset: () => {
      controls.target.copy(DEFAULT_TARGET);
      camera.position.copy(DEFAULT_CAM);
      camera.fov = params.fov;
      camera.updateProjectionMatrix();
      controls.update();
    },
  }, 'reset').name('Reset view');

  fRock.close();
  fForm.close();
  fTerrain.close();
  fDetails.close();
  fFx.close();
  fCam.close();
  if (window.innerWidth < 700) gui.close();

  applyPalette(params.palette);
  updateSky();

  /* ================================================================== */
  /*  camera intro / loop                                               */
  /* ================================================================== */

  const NO_INTRO = new URLSearchParams(location.search).has('nointro');
  const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const intro = {
    active: !NO_INTRO && !REDUCED_MOTION,
    t0: performance.now(),
    from: new THREE.Vector3(26.5, 15.0, 33.0),
    dur: 3400,
  };
  if (!intro.active) {
    camera.position.copy(DEFAULT_CAM);
    controls.target.copy(DEFAULT_TARGET);
    controls.update();
  } else {
    camera.position.copy(intro.from);
    camera.lookAt(controls.target);
    controls.enabled = false;
  }
  renderer.domElement.addEventListener('pointerdown', () => {
    if (intro.active) {
      intro.t0 -= intro.dur;
      intro.active = false;
      controls.enabled = true;
      camera.position.copy(DEFAULT_CAM);
      controls.target.copy(DEFAULT_TARGET);
      controls.update();
    }
    hideHint();
  });
  renderer.domElement.addEventListener('wheel', hideHint, { passive: true });

  const hint = document.getElementById('hint');
  let hintHidden = false;
  function hideHint() {
    if (hintHidden || !hint) return;
    hintHidden = true;
    hint.classList.add('gone');
    setTimeout(() => hint.remove(), 1600);
  }
  setTimeout(hideHint, 9000);

  const clock = new THREE.Clock();
  let elapsed = 0;
  let booted = false;
  let frames = 0;

  function onResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const aspect = w / h;
    camera.aspect = aspect;
    camera.fov = aspect < 0.85 ? params.fov * 1.35 : params.fov;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, QUALITY.maxPixelRatio));
    renderer.setSize(w, h);
    composer.setSize(w, h);
    const pr = Math.min(window.devicePixelRatio || 1, QUALITY.maxPixelRatio);
    gradePass.uniforms.uTexel.value.set(1 / (w * pr), 1 / (h * pr));
  }
  window.addEventListener('resize', onResize);
  onResize();

  function animate() {
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;
    const t = elapsed;

    sandUniforms.uTime.value = t;
    skyUniforms.uTime.value = t;
    windTimeUniform.value = t;
    gradePass.uniforms.uTime.value = t;

    updateTumbleweeds(dt, t);
    updateBirds(dt, t);
    updatePerchedBird(t);
    updateLizard(t);
    updateSandfall(t);
    updateDustDevils(t);
    updateWisps(dt, t);
    updateMotes(dt, t);

    if (intro.active) {
      const k = clamp01((performance.now() - intro.t0) / intro.dur);
      const e = easeOutQuint(k);
      camera.position.lerpVectors(intro.from, DEFAULT_CAM, e);
      camera.lookAt(controls.target);
      if (k >= 1) {
        intro.active = false;
        controls.enabled = true;
        controls.target.copy(DEFAULT_TARGET);
        controls.update();
      }
    } else {
      controls.update();
      const groundY = terrainHeight(camera.position.x, camera.position.z) + 1.35;
      if (camera.position.y < groundY) {
        camera.position.y = groundY;
        controls.update();
      }
    }

    sky.position.copy(camera.position);
    composer.render();

    frames++;
    if (!booted) {
      booted = true;
      window.__erosionReady = true;
      const boot = document.getElementById('boot');
      if (boot) {
        boot.classList.add('done');
        setTimeout(() => boot.remove(), 1300);
      }
    }
  }

  renderer.setAnimationLoop(animate);

  window.__erosion = {
    params,
    scene,
    camera,
    renderer,
    controls,
    rebuildWorld,
    buildFormations,
    buildVegetation,
    buildBirds,
    buildTumbleweeds,
    buildDustDevils,
    buildLizard,
    buildSandfall,
    updateSky,
    applyPalette,
    gui,
    get refs() {
      return { heroGroup, archGroup, perchedBird, lizard, sandfall, tumbleweeds, tumbleweedMesh, birds, dustDevils, rockUniforms, sandUniforms };
    },
    setTime: (h) => {
      params.timeOfDay = h;
      updateSky();
      timeCtrl.updateDisplay();
    },
  };
  </script>
</body>
</html>
